map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=erp_api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=erp_web:10m rate=80r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    error_page 503 = @erp_json_503;
    location @erp_json_503 {
        default_type application/json;
        return 503 '{"success":false,"message":"Too many requests. Please try again later.","errors":[]}';
    }

    location ~ ^/api/procurement/(orders/export|delivery-dispatch|delivery-outcome|delivery-reminder)$ {
        limit_req zone=erp_api burst=180 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=erp_api burst=180 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    location /_next/static/ {
        limit_req zone=erp_web burst=80 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=erp_web burst=80 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
