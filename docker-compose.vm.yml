# =============================================================================
# Single-command VM stack — iConnect Plus / HRMS go-live
# =============================================================================
# One file: Postgres + Redis + RabbitMQ + MinIO + API + Celery + Web + Nginx
# Seeds employee/org/leave/shift/admin data from backups/vm-seed-*.dump
#
# First boot on VM:
#   cp .env.vm.example .env.vm   # edit VM_HOST / secrets
#   bash scripts/deploy-vm.sh
#
# Or manually:
#   docker compose -f docker-compose.vm.yml --env-file .env.vm up -d --build
#
# Open:  http://<VM_HOST>/
# API:   http://<VM_HOST>/api/v1/health
# =============================================================================

name: erp-vm

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-vm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp_hrms}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - erp_vm_pgdata:/var/lib/postgresql/data
      - erp_vm_seed_markers:/var/lib/postgresql/seed-markers
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp-postgres} -d ${POSTGRES_DB:-erp_hrms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-seed:
    image: postgres:16-alpine
    container_name: erp-vm-db-seed
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp_hrms}
      PGHOST: postgres
      PRIMARY_DUMP: /backups/vm-seed-erp_hrms.dump
      SECONDARY_DUMP: /backups/vm-seed-erp.dump
      MARKER_DIR: /var/lib/postgresql/seed-markers
    volumes:
      - ./backups:/backups:ro
      - ./docker/postgres/vm-seed.sh:/vm-seed.sh:ro
      - erp_vm_seed_markers:/var/lib/postgresql/seed-markers
    entrypoint: ["/bin/sh", "/vm-seed.sh"]

  redis:
    image: redis:7-alpine
    container_name: erp-vm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erp_vm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-vm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_dev_password}
    volumes:
      - erp_vm_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: enterprise-erp-minio:local
    container_name: erp-vm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
    volumes:
      - erp_vm_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    build:
      context: ./docker/minio-mc
      dockerfile: Dockerfile
    image: enterprise-erp-minio-mc:local
    container_name: erp-vm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set erp http://minio:9000 $${MINIO_ROOT_USER:-erp_minio} $${MINIO_ROOT_PASSWORD:-erp_minio_password} &&
      mc mb --ignore-existing erp/$${S3_BUCKET:-cache-erp-bucket} &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:vm
    container_name: erp-vm-api
    restart: unless-stopped
    env_file:
      - ${VM_ENV_FILE:-.env.vm}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      INFRA_FALLBACK_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp-postgres}:${POSTGRES_PASSWORD:-erp-postgres}@postgres:5432/${POSTGRES_DB:-erp_hrms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_dev_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-erp_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-erp_minio_password}
      CLAMAV_ENABLED: "false"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - erp_vm_crm_uploads:/app/var/crm-attachments
      - erp_vm_asset_storage:/app/var/asset-storage
    depends_on:
      postgres:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12

  celery-worker:
    image: enterprise-erp-api:vm
    pull_policy: never
    container_name: erp-vm-celery
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - ${VM_ENV_FILE:-.env.vm}
    environment:
      INFRA_FALLBACK_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp-postgres}:${POSTGRES_PASSWORD:-erp-postgres}@postgres:5432/${POSTGRES_DB:-erp_hrms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_dev_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "false"
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-erp_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-erp_minio_password}
      CLAMAV_ENABLED: "false"
    volumes:
      - erp_vm_crm_uploads:/app/var/crm-attachments
      - erp_vm_asset_storage:/app/var/asset-storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-iConnect Plus}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
        API_INTERNAL_URL: http://api:8000
    image: enterprise-erp-web:vm
    container_name: erp-vm-web
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-vm-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/vm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  erp_vm_pgdata:
    name: erp_vm_pgdata
  erp_vm_seed_markers:
    name: erp_vm_seed_markers
  erp_vm_redis:
    name: erp_vm_redis
  erp_vm_rabbitmq:
    name: erp_vm_rabbitmq
  erp_vm_minio:
    name: erp_vm_minio
  erp_vm_crm_uploads:
    name: erp_vm_crm_uploads
  erp_vm_asset_storage:
    name: erp_vm_asset_storage
