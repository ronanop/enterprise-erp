# Local all-in-one stack — infra mirrors docker-compose.infra.yml + API / Celery / Web
# Local-only (no VM). Sync DB from VM: powershell -File scripts/sync-from-vm.ps1 -SkipMinio
# Infra DNS: postgres / redis / rabbitmq / opensearch / clamav / minio
# Host ports: API :8000 | Web :3000 | Postgres :5433 | Redis :6379 | RabbitMQ :5672/:15672
#             OpenSearch :9200 | ClamAV :3310 | MinIO :9000/:9001

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp-postgres} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - erp_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - erp_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: erp-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - erp_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    container_name: erp-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "1800"
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - erp_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  # Built from source — MinIO removed public Docker Hub / Quay images (Sep 2026).
  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: enterprise-erp-minio:local
    container_name: erp-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - erp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    build:
      context: ./docker/minio-mc
      dockerfile: Dockerfile
    image: enterprise-erp-minio-mc:local
    container_name: erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set erp http://minio:9000 $${MINIO_ROOT_USER:-erp_minio} $${MINIO_ROOT_PASSWORD:-erp_minio_password} &&
      mc mb --ignore-existing erp/$${S3_BUCKET:-cache-erp-bucket} &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    container_name: erp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      # Compose network DNS — local services only (never VM host IPs).
      INFRA_FALLBACK_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp-postgres}:${POSTGRES_PASSWORD:-erp-postgres}@postgres:5432/${POSTGRES_DB:-erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_dev_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENSEARCH_URL: http://opensearch:9200
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/auth/microsoft/callback}
      # Local MinIO (built from source — public Hub/Quay images removed)
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-erp_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-erp_minio_password}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-45}
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
      ACCESS_BIND_USER_AGENT: ${ACCESS_BIND_USER_AGENT:-true}
      ACCESS_BIND_IP: ${ACCESS_BIND_IP:-false}
      REFRESH_REUSE_DETECTION: ${REFRESH_REUSE_DETECTION:-true}
      JWT_PRIVILEGED_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_PRIVILEGED_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      # Platform rate limits (writes / uploads). GETs stay unlimited locally unless set.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-0}
      API_WRITE_RATE_LIMIT: ${API_WRITE_RATE_LIMIT:-120}
      API_WRITE_RATE_WINDOW_SECONDS: ${API_WRITE_RATE_WINDOW_SECONDS:-60}
      API_UPLOAD_RATE_LIMIT: ${API_UPLOAD_RATE_LIMIT:-30}
      API_UPLOAD_RATE_WINDOW_SECONDS: ${API_UPLOAD_RATE_WINDOW_SECONDS:-60}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    ports:
      - "8000:8000"
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    pull_policy: never
    container_name: erp-celery-worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      INFRA_FALLBACK_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp-postgres}:${POSTGRES_PASSWORD:-erp-postgres}@postgres:5432/${POSTGRES_DB:-erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-erp}:${RABBITMQ_PASSWORD:-erp_dev_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENSEARCH_URL: http://opensearch:9200
      RUN_MIGRATIONS: "false"
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cache-erp-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-erp_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-erp_minio_password}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-45}
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_started
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Connect Plus}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
        NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${NEXT_PUBLIC_ELEVENLABS_AGENT_ID:-}
        API_INTERNAL_URL: http://api:8000
    image: enterprise-erp-web:local
    container_name: erp-web
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  erp_pgdata:
    name: erp_pgdata
  erp_redis_data:
    name: erp_redis_data
  erp_rabbitmq_data:
    name: erp_rabbitmq_data
  erp_opensearch_data:
    name: erp_opensearch_data
  erp_minio_data:
    name: erp_minio_data
  erp_clamav_data:
    name: erp_clamav_data
  erp_crm_uploads:
    name: erp_crm_uploads
  erp_asset_storage:
    name: erp_asset_storage
