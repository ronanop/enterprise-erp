# Path B — Postgres only (Coolify → test-db VM)
# -----------------------------------------------
# Coolify UI:
#   - Docker Compose Location: docker-compose.test-db.yml
#   - Server / destination: test-db
#   - Auto-deploy: on
# Env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
# Host publish: 5432 (app VM reaches this via private IP in DATABASE_URL)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-erp-postgres} -d ${POSTGRES_DB:-erp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  test_pgdata:
