# Full ERP stack for Coolify or local Docker (API + workers + frontends + data services).
#
# Quick start:
#   cp .env.coolify.example .env.coolify
#   # Edit secrets and NEXT_PUBLIC_API_URL
#   docker compose -f docker-compose.coolify.yml --env-file .env.coolify up -d --build
#
# Optional OpenSearch + extra MinIO wiring:
#   docker compose -f docker-compose.coolify.yml --env-file .env.coolify --profile full up -d --build

name: enterprise-erp

x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8000}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  CORS_ORIGINS: ${CORS_ORIGINS}
  CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
  CRM_UPLOAD_ROOT: ${CRM_UPLOAD_ROOT:-/app/var/crm-attachments}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
  EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-async}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-erp-documents}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_FROM_EMAIL: ${AZURE_FROM_EMAIL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp]

  minio:
    profiles: [full]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp]

  opensearch:
    profiles: [full]
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [erp]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:${DEPLOY_ENV:-staging}
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - crm_uploads:/app/var/crm-attachments
    ports:
      - "${API_PUBLISH_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [erp]

  celery-worker:
    image: enterprise-erp-api:${DEPLOY_ENV:-staging}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["worker"]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - crm_uploads:/app/var/crm-attachments
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [erp]

  celery-beat:
    image: enterprise-erp-api:${DEPLOY_ENV:-staging}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["beat"]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      celery-worker:
        condition: service_started
    networks: [erp]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Enterprise ERP}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISH_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [erp]

  employee-app:
    build:
      context: ./apps/employee-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_EMPLOYEE_APP_NAME:-Employee App}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    restart: unless-stopped
    ports:
      - "${EMPLOYEE_PUBLISH_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_started
    networks: [erp]

networks:
  erp:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  opensearch_data:
  crm_uploads:
