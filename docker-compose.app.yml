# App-only stack for coexistence with other host services.
# Infra on this VM: docker compose -f docker-compose.infra.yml
# (Postgres, Redis, RabbitMQ, OpenSearch, MinIO on erp-net).
# Object storage: MinIO via S3_ENDPOINT_URL (AWS S3 disabled).
# Shares Docker network `erp-net` with infra (REDIS_URL=redis://redis:6379/0, etc.).
# Does NOT bind 80/443/5432/6379/5672/9200/9000.
# Host ports: API :8010  |  Web :3000  |  Employee :3001  |  Nginx TLS :8443

networks:
  erp-net:
    name: erp-net
    external: true

services:
  api:
    networks: [erp-net]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    container_name: erp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      RUN_MIGRATIONS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://172.16.200.30:3000}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-minio}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-minio}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ACCESS_CODE_DEMO: ${ACCESS_CODE_DEMO:-ICP-DEMO-2026}
      ACCESS_CODE_CONNECTPLUS: ${ACCESS_CODE_CONNECTPLUS:-ICP-CONNECT-2026}
      ACCESS_GATE_TOKEN_HOURS: ${ACCESS_GATE_TOKEN_HOURS:-12}
    ports:
      - "8010:8000"
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\" || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  celery-worker:
    networks: [erp-net]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    pull_policy: never
    container_name: erp-celery-worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      RUN_MIGRATIONS: "false"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-minio}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-minio}
      ASSET_STORAGE_PATH: /app/var/asset-storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ACCESS_CODE_DEMO: ${ACCESS_CODE_DEMO:-ICP-DEMO-2026}
      ACCESS_CODE_CONNECTPLUS: ${ACCESS_CODE_CONNECTPLUS:-ICP-CONNECT-2026}
      ACCESS_GATE_TOKEN_HOURS: ${ACCESS_GATE_TOKEN_HOURS:-12}
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    networks: [erp-net]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://172.16.200.30:8443/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-iConnect Plus}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-admin@example.com}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-Secure1!}
        NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${NEXT_PUBLIC_ELEVENLABS_AGENT_ID:-}
        API_INTERNAL_URL: http://api:8000
    image: enterprise-erp-web:local
    container_name: erp-web
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  employee-app:
    networks: [erp-net]
    build:
      context: ./apps/employee-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_EMPLOYEE_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME_EMPLOYEE:-Employee App}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    image: enterprise-erp-employee:local
    container_name: erp-employee-app
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      API_PROXY_TARGET: http://api:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    networks: [erp-net]
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/coexist.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs/erp.crt:/etc/nginx/certs/erp.crt:ro
      - ./docker/nginx/certs/erp.key:/etc/nginx/certs/erp.key:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  erp_crm_uploads:
    name: erp_crm_uploads
  erp_asset_storage:
    name: erp_asset_storage
