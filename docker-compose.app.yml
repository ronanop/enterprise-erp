# App-only stack for coexistence with other host services.
# Shared infra: 172.16.200.26 (Postgres, Redis, RabbitMQ, MinIO, OpenSearch).
# Does NOT bind 80/443/5432/6379/5672/9000/9200.
# Host ports: API http://172.16.200.30:8010  |  Web http://172.16.200.30:3000

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    container_name: erp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_SECURE: "false"
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      RUN_MIGRATIONS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://172.16.200.30:3000}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      ASSET_STORAGE_BACKEND: local
      ASSET_STORAGE_PATH: /app/var/asset-storage
    ports:
      - "8010:8000"
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: enterprise-erp-api:local
    pull_policy: never
    container_name: erp-celery-worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      RUN_MIGRATIONS: "false"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      ASSET_STORAGE_BACKEND: local
      ASSET_STORAGE_PATH: /app/var/asset-storage
    volumes:
      - erp_crm_uploads:/app/var/crm-attachments
      - erp_asset_storage:/app/var/asset-storage
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://172.16.200.30:8443/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Enterprise ERP}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-admin@example.com}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-Secure1!}
        NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${NEXT_PUBLIC_ELEVENLABS_AGENT_ID:-}
        API_INTERNAL_URL: http://api:8000
    image: enterprise-erp-web:local
    container_name: erp-web
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/coexist.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs/erp.crt:/etc/nginx/certs/erp.crt:ro
      - ./docker/nginx/certs/erp.key:/etc/nginx/certs/erp.key:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  erp_crm_uploads:
    name: erp_crm_uploads
  erp_asset_storage:
    name: erp_asset_storage
