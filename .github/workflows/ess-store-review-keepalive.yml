# Keep the free Render ESS store-review API awake (no paid plan).
# Render free spins down after ~15m idle; ping /health every 5 minutes.
#
# Optional repo Variable: ESS_STORE_REVIEW_HEALTH_URL
# Default: https://ess-api.iconnectplus.in/api/v1/health

name: ESS store-review keepalive

on:
  schedule:
    # GitHub cron can drift a few minutes; 5m is still under Render's sleep window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        env:
          HEALTH_URL: ${{ vars.ESS_STORE_REVIEW_HEALTH_URL || 'https://ess-api.iconnectplus.in/api/v1/health' }}
        run: |
          set -euo pipefail
          echo "Pinging ${HEALTH_URL}"
          # Retry a few times in case of cold start
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 60 "$HEALTH_URL" || true)
            echo "attempt=${i} http=${code}"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries" >&2
          cat /tmp/health.json || true
          exit 1
