<!-- Logic for Timer and Confetti -->
<script>
        // Timer Logic
        let seconds = 1;
        const timerDisplay = document.getElementById('clock-timer');

        function updateTimer() {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            const formatted = [
                hrs.toString().padStart(2, '0'),
                mins.toString().padStart(2, '0'),
                secs.toString().padStart(2, '0')
            ].join(':');
            
            timerDisplay.textContent = formatted;
            seconds++;
        }
        setInterval(updateTimer, 1000);

        // Confetti Logic
        const wrapper = document.getElementById('confetti-wrapper');
        const colors = ['#10B981', '#004ac6', '#6ffbbe', '#2563eb', '#ffffff'];

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                
                const duration = 2 + Math.random() * 3;
                confetti.style.animation = `confetti-fall ${duration}s linear forwards`;
                confetti.style.opacity = Math.random();
                
                wrapper.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }

        // Run confetti on load
        window.addEventListener('DOMContentLoaded', () => {
            createConfetti();
            // Periodic tiny bursts for "alive" feel
            setInterval(() => {
                if(Math.random() > 0.8) createConfetti();
            }, 3000);
        });

        // Add haptic feedback simulation
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
