        @keyframes float {

            100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }

            animation: float 6s ease-in-out infinite;

<!-- STITCH_SHADER_START:ANIMATION_47 class="absolute inset-0 w-full h-full opacity-60" -->
<div class="absolute inset-0 w-full h-full opacity-60" style="display:block;">
<canvas id="shader-canvas-ANIMATION_47" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_47');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    vec2 center = vec2(0.5, 0.5);
    
    // Create a flowing, multi-color gradient mesh
    float dist = distance(uv, center);
    
    // Base colors from the palette
    vec3 royalBlue = vec3(0.145, 0.388, 0.922); // #2563EB
    vec3 indigo = vec3(0.388, 0.4, 0.945);    // #6366F1
    vec3 purple = vec3(0.486, 0.227, 0.929);    // #7C3AED
    vec3 bg = vec3(0.973, 0.98, 0.988);         // #F8FAFC
    
    // Animated noise/flow
    float noise = sin(uv.x * 3.0 + u_time * 0.5) * cos(uv.y * 3.0 - u_time * 0.3);
    float noise2 = sin(uv.y * 5.0 - u_time * 0.7) * cos(uv.x * 2.0 + u_time * 0.4);
    
    vec3 color = bg;
    
    // Layered soft blobs
    float blob1 = smoothstep(0.6, 0.0, distance(uv + vec2(sin(u_time*0.4)*0.2, cos(u_time*0.3)*0.2), vec2(0.3, 0.3)));
    float blob2 = smoothstep(0.7, 0.0, distance(uv + vec2(cos(u_time*0.5)*0.3, sin(u_time*0.4)*0.1), vec2(0.7, 0.6)));
    float blob3 = smoothstep(0.5, 0.0, distance(uv + vec2(sin(u_time*0.6)*0.1, sin(u_time*0.2)*0.3), vec2(0.5, 0.4)));
    
    color = mix(color, royalBlue, blob1 * 0.15);
    color = mix(color, indigo, blob2 * 0.12);
    color = mix(color, purple, blob3 * 0.1);
    
    // Add subtle grain
    float grain = (fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.02;
    color += grain;
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
            // Subtle parallax effect on mouse move
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                const hero = document.querySelector('.animate-float');
                if (hero) {
                    hero.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });

            // Simulate loading completion for visual feedback
            setTimeout(() => {
                const label = document.querySelector('.font-label-md');
                if (label) {
                    label.textContent = "Almost ready...";
                }
            }, 3000);
        </script>
