<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        .ai-glow {
            box-shadow: 0 0 80px 10px rgba(37, 99, 235, 0.15);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .animate-pulse-slow {
            animation: pulse-slow 6s ease-in-out infinite;
        }

        .active-dot {
            width: 24px;
            background-color: #004ac6;
        }
        
        .inactive-dot {
            width: 6px;
            background-color: #c3c6d7;

<!-- Micro-interaction Script -->
<script>
        // Simple touch feedback and subtle parallax for the floating chips
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const mouseX = e.clientX - centerX;
            const mouseY = e.clientY - centerY;
            
            const chips = document.querySelectorAll('.glass-card');
            chips.forEach((chip, index) => {
                const depth = (index + 1) * 0.02;
                const moveX = mouseX * depth;
                const moveY = mouseY * depth;
                chip.style.transform = `translate(${moveX}px, ${moveY}px) ${chip.classList.contains('rotate-3') ? 'rotate(3deg)' : chip.classList.contains('-rotate-6') ? 'rotate(-6deg)' : 'rotate(-2deg)'}`;
            });
        });
    </script>
