<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Employee Portal - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#0b1c30",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-secondary-container": "#fffbff",
                    "tertiary-fixed-dim": "#4edea3",
                    "tertiary-fixed": "#6ffbbe",
                    "primary-fixed": "#dbe1ff",
                    "secondary-fixed": "#eaddff",
                    "surface-container-high": "#dce9ff",
                    "tertiary": "#006242",
                    "secondary-container": "#8a4cfc",
                    "primary": "#004ac6",
                    "on-primary-container": "#eeefff",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#002113",
                    "surface-tint": "#0053db",
                    "surface-dim": "#cbdbf5",
                    "surface-bright": "#f8f9ff",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#d3e4fe",
                    "inverse-surface": "#213145",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-background": "#0b1c30",
                    "surface-container-low": "#eff4ff",
                    "tertiary-container": "#007d55",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-container": "#e5eeff",
                    "surface-variant": "#d3e4fe",
                    "on-primary-fixed-variant": "#003ea8",
                    "primary-container": "#2563eb",
                    "on-secondary-fixed-variant": "#5a00c6",
                    "outline-variant": "#c3c6d7",
                    "inverse-on-surface": "#eaf1ff",
                    "on-tertiary-container": "#bdffdb",
                    "error": "#ba1a1a",
                    "background": "#f8f9ff",
                    "secondary": "#712ae2",
                    "on-surface-variant": "#434655",
                    "on-secondary-fixed": "#25005a",
                    "on-primary-fixed": "#00174b",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#f8f9ff",
                    "on-tertiary": "#ffffff",
                    "outline": "#737686",
                    "secondary-fixed-dim": "#d2bbff",
                    "inverse-primary": "#b4c5ff",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "container-padding": "20px",
                    "stack-gap-sm": "8px",
                    "stack-gap-lg": "24px",
                    "section-margin": "32px",
                    "stack-gap-md": "16px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "title-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-sm": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "display-md": ["Inter"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "display-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .gradient-ai {
            background: linear-gradient(135deg, #712ae2 0%, #2563eb 100%);
        }
    </style>
</head>
<body class="text-on-surface antialiased">
<!-- Onboarding Container -->
<main class="relative h-screen w-full flex flex-col overflow-hidden bg-surface-bright">
<!-- Top Visual Area (Asymmetric/Modern Background) -->
<div class="relative flex-1 flex flex-col items-center justify-center pt-container-padding overflow-hidden">
<!-- Decorative Elements (Blurry Orbs) -->
<div class="absolute top-[-10%] right-[-20%] w-80 h-80 bg-primary/10 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[20%] left-[-20%] w-64 h-64 bg-secondary/10 rounded-full blur-[60px]"></div>
<!-- Main Illustration Shell -->
<div class="relative z-10 w-full max-w-sm px-container-padding flex items-center justify-center animate-float">
<!-- User Image Instruction Applied -->
<div class="relative w-full aspect-[9/16] max-h-[60vh] flex items-center justify-center">
<img class="w-full h-full object-contain drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfOeapYACna1a9AAv-w6wY3s0n0x-RgOphkesRDQEWzaokeNQV9QM6G2JJ1s6EE-Kc4HxjfD5DArn49Tdt-WCRfohe56MNjKhHqgtdqatg6jKmRC0Al8mOV27qKMgFuixQhWjFzgdmo_ybhC0787YJdqaX4ee4F0yN7dJAx9OizX2rWMhNl9Zxxml2kxkTwij5HyXDuKqITVYl3rP-TqxDJrQuepZq8kTW8BNwdT1ezulhw4h_ZTr37Rri9ShxbSDB9QvW3eItjtc">
</div>
</div>
</div>
<!-- Content Area: Bento-inspired Rounded Card -->
<div class="relative z-20 glass-panel rounded-t-[32px] px-container-padding pt-10 pb-safe-area shadow-[0_-10px_40px_rgba(0,0,0,0.03)] border-t border-white/50">
<!-- Text Content -->
<div class="text-center space-y-stack-gap-md max-w-xs mx-auto">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight leading-tight">
                    Attendance Made Easy
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Check in, check out, and track work hours with one tap.
                </p>
</div>
<!-- Interaction Layer -->
<div class="mt-stack-gap-lg space-y-stack-gap-lg">
<!-- Progress Indicator -->
<div class="flex justify-center items-center gap-2">
<div class="h-1.5 w-4 rounded-full bg-outline-variant/40"></div>
<div class="h-1.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-4 rounded-full bg-outline-variant/40"></div>
<div class="h-1.5 w-4 rounded-full bg-outline-variant/40"></div>
</div>
<!-- Action Row -->
<div class="flex items-center justify-between gap-stack-gap-md pb-8">
<button class="px-6 py-3 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors active:scale-95">
                        Skip
                    </button>
<button class="bg-primary text-on-primary font-label-md text-label-md px-10 py-4 rounded-full shadow-lg shadow-primary/20 flex items-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all group">
                        Next
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- AI Assistant FAB (Contextual for Onboarding) -->
<div class="fixed bottom-32 right-container-padding z-30">
<button class="gradient-ai w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl shadow-secondary/30 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-primary');
            nextBtn.addEventListener('click', () => {
                // Visual feedback only for demo
                nextBtn.classList.add('scale-95');
                setTimeout(() => nextBtn.classList.remove('scale-95'), 150);
            });
        });
    </script>
</body></html>
