<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#0b1c30",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary-container": "#fffbff",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#dbe1ff",
                        "secondary-fixed": "#eaddff",
                        "surface-container-high": "#dce9ff",
                        "tertiary": "#006242",
                        "secondary-container": "#8a4cfc",
                        "primary": "#004ac6",
                        "on-primary-container": "#eeefff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#002113",
                        "surface-tint": "#0053db",
                        "surface-dim": "#cbdbf5",
                        "surface-bright": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-background": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "tertiary-container": "#007d55",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container": "#e5eeff",
                        "surface-variant": "#d3e4fe",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-container": "#2563eb",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "outline-variant": "#c3c6d7",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-container": "#bdffdb",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "secondary": "#712ae2",
                        "on-surface-variant": "#434655",
                        "on-secondary-fixed": "#25005a",
                        "on-primary-fixed": "#00174b",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "outline": "#737686",
                        "secondary-fixed-dim": "#d2bbff",
                        "inverse-primary": "#b4c5ff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "20px",
                        "stack-gap-sm": "8px",
                        "stack-gap-lg": "24px",
                        "section-margin": "32px",
                        "stack-gap-md": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "display-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-background selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Main Container -->
<main class="relative h-screen w-full flex flex-col justify-between items-center max-w-md mx-auto bg-surface-container-lowest overflow-hidden">
<!-- Background Atmospheric Glow -->
<div class="absolute top-[-10%] right-[-20%] w-[300px] h-[300px] bg-primary/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-10%] w-[250px] h-[250px] bg-secondary/10 blur-[80px] rounded-full"></div>
<!-- Top Header Navigation (Hidden in mobile shell if following transactional rule, but here for context) -->
<div class="w-full px-container-padding pt-12 flex justify-end z-10">
<button class="text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors py-2 px-4 rounded-full active:scale-95 duration-150">
                Skip
            </button>
</div>
<!-- Visual Content Area -->
<div class="flex-1 w-full flex flex-col items-center justify-center px-container-padding z-10">
<!-- Central Hero Illustration -->
<div class="relative w-full aspect-[4/5] flex items-center justify-center mb-section-margin fade-in-up">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 to-transparent rounded-[40px] rotate-3 scale-95 blur-sm"></div>
<div class="relative w-full h-full rounded-[32px] overflow-hidden shadow-2xl shadow-primary/10">
<img alt="Modern AI workplace illustration with glassmorphism dashboard elements and a futuristic office setup" class="w-full h-full object-cover animate-float" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1HsPuSsu_OaJtZAG4rpXSxj0vACsupLef9GzUgJtRxoy4x2ZK4mtjYbf_7VBe5BqGxdejT0NEE0Y7_103j_-NEben_e-pjpv_UJIjCTZ2LKcZ1RGNATznzjHIBh4SDPX8Fsb2_-vm7wSgTF13aScNLDuWnMjb-lfbRCLP1Cmce5aaqAYJzXVuxGSB78sRoBxuGUOWWrKFbr85MvS_V6hYTJQPhFq_OCrZMpDFNsyVQ3Sej-cEbL2OIZQRmJyPdRpE7xgVqn5kUqw">
</div>
<!-- Floating Glass Elements Decoration -->
<div class="absolute -top-4 -right-4 w-20 h-20 glass-card rounded-2xl flex items-center justify-center shadow-lg animate-float" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-primary text-3xl">arrow_back_ios_new</span>
</div>
<div class="absolute -bottom-6 -left-2 w-24 h-12 glass-card rounded-xl flex items-center justify-center shadow-lg animate-float" style="animation-delay: 2s;">
<div class="flex gap-1">
<div class="w-2 h-2 rounded-full bg-primary/40"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-primary/40"></div>
</div>
</div>
</div>
<!-- Copy Content -->
<div class="text-center space-y-stack-gap-md fade-in-up" style="animation-delay: 0.2s;">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight">
                    Welcome to <span class="text-primary">Employee Portal AI</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    Manage your work life effortlessly with intelligent automation and refined insights.
                </p>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full px-container-padding pb-12 z-10 fade-in-up" style="animation-delay: 0.4s;">
<div class="flex flex-col items-center gap-stack-gap-lg">
<!-- Progress Indicators -->
<div class="flex gap-2">
<div class="h-1.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant transition-all duration-300"></div>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 bg-primary text-on-primary font-label-md text-label-md rounded-full flex items-center justify-center gap-2 shadow-xl shadow-primary/20 hover:bg-primary/90 transition-all active:scale-[0.98] group">
                    Next
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="font-label-sm text-label-sm text-outline select-none">
                    1 of 4
                </p>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextButton = document.querySelector('button');
            nextButton.addEventListener('click', () => {
                // Subtle feedback before navigation
                const content = document.querySelector('main');
                content.style.opacity = '0';
                content.style.transform = 'translateX(-20px)';
                content.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            });
        });
    </script>
</body></html>
